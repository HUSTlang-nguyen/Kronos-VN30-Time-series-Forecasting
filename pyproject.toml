[project]
name = "vn30-tsfm-research"
version = "0.1.0"
description = "Reproducible VN30 forecasting benchmark for statistical models, generic TSFMs, and Kronos"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chronos-forecasting==2.3.2",
  "einops==0.8.1",
  "huggingface-hub==0.33.1",
  "matplotlib==3.9.3",
  "numpy>=1.26,<3",
  "pandas==2.2.2",
  "pyarrow>=17,<24",
  "pyyaml>=6.0,<7",
  "safetensors==0.6.2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "torch==2.14.0",
  "tqdm==4.67.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
