name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/data.txt
      - run: python scripts/export_data_requirements.py --check
      - run: python -m pip install --require-hashes -r requirements/data.txt
      - name: Check Python syntax
        run: python -c "import ast; from pathlib import Path; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for folder in ('scripts','src') for p in Path(folder).glob('*.py')]"
      - run: python scripts/check_shared_data.py --help
      - run: python scripts/configure_dvc_drive.py --help
      - run: python scripts/share_vndirect_snapshot.py --help
      - run: python scripts/share_vndirect_sqlite.py --help
      - run: python scripts/validate_vn30_sources.py --help
      - run: python scripts/forecast_vn30.py --help
      - name: Check temporal rules, data audit and experiment coordination
        run: python -m unittest discover -s tests -v
  docker-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile cuda config --quiet
      - run: docker compose build data
      - run: docker compose run --rm data python scripts/check_shared_data.py --help
